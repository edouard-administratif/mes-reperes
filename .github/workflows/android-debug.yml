name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Restore Gradle downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/android-docker/gradle
          key: android-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare optional debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            umask 077
            mkdir -p .cache/android-docker/android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > .cache/android-docker/android/debug.keystore
            echo 'Existing debug signing key restored.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No debug signing secret configured: this run will generate a temporary debug key. Updating a previously installed APK may require a reinstall.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build using the pinned Android Docker image
        run: npm run android:docker

      - name: Check and package the APK
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tq android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/mes-reperes-debug.apk
          cd artifacts
          sha256sum mes-reperes-debug.apk > mes-reperes-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mes-reperes-debug-${{ github.run_number }}
          path: |
            artifacts/mes-reperes-debug.apk
            artifacts/mes-reperes-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove restored signing material
        if: always()
        shell: bash
        run: rm -f .cache/android-docker/android/debug.keystore
